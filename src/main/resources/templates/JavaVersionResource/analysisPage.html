<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Version Analysis Results</title>
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/pdf-styles.css">
    <script src="/js/theme.js"></script>
    <!-- PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js" crossorigin="anonymous"></script>
    <!-- PDF Export Module -->
    <script src="/js/analysis.js" defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-body);
            min-height: 100vh;
            padding: 20px;
            transition: var(--theme-transition);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--bg-container);
            border-radius: 20px;
            box-shadow: var(--shadow-default);
            overflow: hidden;
            transition: var(--theme-transition);
            position: relative;
        }

        .header {
            background: linear-gradient(135deg, var(--color-gradient-start) 0%, var(--color-gradient-end) 100%);
            color: var(--text-white);
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            font-weight: 300;
            margin-bottom: 10px;
        }

        .header .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        /* Results Header */
        .results-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .recommendation {
            font-size: 0.9em;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            transition: var(--theme-transition);
        }

        .outcome {
            font-size: 3em;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 15px;
            transition: var(--theme-transition);
        }

        .outcome-description {
            font-size: 1em;
            color: var(--text-secondary);
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
            transition: var(--theme-transition);
        }

        /* Summary Cards */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .summary-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            transition: var(--theme-transition);
            box-shadow: var(--shadow-small);
        }

        .summary-number {
            font-size: 3em;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 12px;
            transition: var(--theme-transition);
        }

        .summary-label {
            font-size: 0.9em;
            color: var(--text-secondary);
            line-height: 1.4;
            transition: var(--theme-transition);
        }

        /* Modal styles for assessment form (FR-006) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }

        .modal-overlay.hidden {
            display: none;
        }

        .modal {
            background: var(--bg-container);
            border-radius: 15px;
            box-shadow: var(--shadow-default);
            max-width: 600px;
            width: 90%;
            padding: 40px;
            z-index: 1001;
            transition: var(--theme-transition);
        }

        .modal h2 {
            color: var(--text-primary);
            margin-bottom: 10px;
            font-size: 1.8em;
        }

        .modal p {
            color: var(--text-secondary);
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-default);
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 1em;
            transition: var(--transition-fast);
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-error {
            color: #dc2626;
            font-size: 0.9em;
            margin-top: 5px;
            display: none;
        }

        .form-error.visible {
            display: block;
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--color-gradient-start) 0%, var(--color-gradient-end) 100%);
            color: var(--text-white);
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-default);
            box-shadow: var(--shadow-small);
            width: 100%;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Blur effect for preview table (FR-004, FR-005) */
        .blurred {
            filter: blur(8px);
            pointer-events: none;
            user-select: none;
        }

        .hidden {
            display: none !important;
        }

        .table-container {
            background: var(--bg-container);
            border-radius: 15px;
            box-shadow: var(--shadow-card);
            overflow: hidden;
            margin-bottom: 30px;
            transition: var(--theme-transition);
        }

        .table-header {
            background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-tertiary) 100%);
            padding: 20px;
            border-bottom: 2px solid var(--border-table);
        }

        .table-title {
            font-size: 1.3em;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 5px;
            transition: var(--theme-transition);
        }

        .table-subtitle {
            color: var(--text-secondary);
            font-size: 0.9em;
            transition: var(--theme-transition);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th, td {
            padding: 15px 20px;
            text-align: left;
            border-bottom: 1px solid var(--border-light);
        }

        th {
            background: var(--bg-secondary);
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: var(--theme-transition);
        }

        td {
            color: var(--text-secondary);
            font-size: 0.95em;
            transition: var(--theme-transition);
        }

        tr:hover {
            background-color: var(--bg-hover);
        }

        .version-badge {
            background: linear-gradient(135deg, var(--color-gradient-start) 0%, var(--color-gradient-end) 100%);
            color: var(--text-white);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
            display: inline-block;
        }

        .warning-badge {
            background: var(--badge-warning-bg);
            color: var(--badge-warning-text);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 500;
            border: 1px solid var(--badge-warning-border);
        }

        .danger-badge {
            background: var(--badge-danger-bg);
            color: var(--badge-danger-text);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 500;
            border: 1px solid var(--badge-danger-border);
        }

        .success-badge {
            background: var(--badge-success-bg);
            color: var(--badge-success-text);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 500;
            border: 1px solid var(--badge-success-border);
        }

        .license-info {
            position: relative;
            display: inline-block;
        }

        .license-tooltip {
            visibility: hidden;
            width: 300px;
            max-width: 90vw;
            background-color: var(--tooltip-bg);
            color: var(--tooltip-text);
            text-align: left;
            border-radius: 6px;
            padding: 8px;
            position: absolute;
            z-index: 1000;
            bottom: 125%;
            right: 0;
            opacity: 0;
            transition: opacity 0.3s;
            font-size: 0.8em;
            line-height: 1.3;
            white-space: normal;
            word-wrap: break-word;
        }

        .license-tooltip::after {
            content: "";
            position: absolute;
            top: 100%;
            right: 20px;
            border-width: 5px;
            border-style: solid;
            border-color: var(--tooltip-bg) transparent transparent transparent;
        }

        .license-info:hover .license-tooltip {
            visibility: visible;
            opacity: 1;
        }

        .back-btn {
            background: linear-gradient(135deg, var(--color-gradient-start) 0%, var(--color-gradient-end) 100%);
            color: var(--text-white);
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-default);
            box-shadow: var(--shadow-small);
            text-decoration: none;
            display: inline-block;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }

        .loading-indicator {
            text-align: center;
            padding: 20px;
            color: var(--text-secondary);
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-default);
            border-top: 4px solid var(--color-primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="theme-toggle">
        <select id="theme-selector" aria-label="Select theme">
            <option value="auto">🌓 Auto</option>
            <option value="light">☀️ Light</option>
            <option value="dark">🌙 Dark</option>
        </select>
    </div>

    <!-- Assessment Form Modal (FR-006) -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <h2>Complete Your Assessment</h2>
            <p>To view your full analysis results, please provide the following information:</p>

            <form id="assessment-form">
                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" required>
                    <div class="form-error" id="email-error">Please enter a valid email address</div>
                </div>

                <div class="form-group">
                    <label for="companyName">Company Name *</label>
                    <input type="text" id="companyName" name="companyName" required>
                    <div class="form-error" id="companyName-error">Company name is required</div>
                </div>

                <div class="form-group">
                    <label for="role">Role (Optional)</label>
                    <input type="text" id="role" name="role">
                </div>

                <button type="submit" class="submit-btn" id="submit-btn">Submit & View Results</button>
            </form>
        </div>
    </div>

    <div class="container">
        <div class="content">
            <!-- Loading indicator (FR-019) -->
            <div class="loading-indicator" id="loading-indicator">
                <div class="spinner"></div>
                <p>Loading analysis results...</p>
            </div>

            <!-- Tables will be populated by JavaScript -->
            <div id="tables-container"></div>

            <div style="text-align: center; margin-top: 40px;">
                <a href="/" class="back-btn">🏠 Back to Home</a>
            </div>
        </div>
    </div>

    <!-- PDF Download Button -->
    <button id="pdf-download-btn" class="pdf-download-btn" 
            aria-label="Download analysis results as PDF"
            data-tooltip="Download PDF Report"
            style="display: none;">
        📄
    </button>

    <!-- PDF Export Module -->
    <script src="/js/pdf-export.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // PDF button visibility will be controlled by analysis.js when data is revealed
            if (window.PDFExport) {
                // Initially hidden until analysis is revealed
                PDFExport.setButtonVisibility('pdf-download-btn', false);
            }
        });
    </script>
</body>
</html>
